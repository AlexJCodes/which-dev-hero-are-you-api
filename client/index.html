<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Which Dev Hero Are You?</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main class="app">
        <section class="hero">
            <p class="eyebrow">Developer Personality Quiz</p>
            <h1>Which Dev Hero Are You?</h1>
            <p>
                Answer quirky coding questions and discover your inner developer
                hero.
            </p>
        </section>

        <section class="panel">
            <h2>Questions from API</h2>

            <button id="load-questions-button" type="button">
                Load questions
            </button>

            <p id="status-message" class="status-message"></p>

            <div id="questions-list" class="questions-list"></div>
        </section>
    </main>

    <script src="./script.js"></script>
</body>

</html>
